<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MusiKaoz - Terminal de Acceso</title>
  <link rel="stylesheet" href="login.css">
</head>
<body class="cybergoth-layout">
  <main class="auth-box">
    <header class="auth-box__header">
      <div class="auth-box__hazard-icon">☣</div>
      <h1 class="auth-box__title">MUSIKAOZ</h1>
      <span class="auth-box__subtitle">SECTOR_RESTRICTO // BIO_ACCESO</span>
    </header>

    <form class="auth-box__form">
      <div class="auth-field">
        <label class="auth-field__label" for="username">IDENTIFICADOR</label>
        <input class="auth-field__input" type="text" id="username" placeholder="id_sujeto" required>
      </div>

      <div class="auth-field">
        <label class="auth-field__label" for="password">SECUENCIA_CLAVE</label>
        <input class="auth-field__input" type="password" id="password" placeholder="••••••••" required>
      </div>

      <button class="auth-box__button" type="submit">INICIAR_INYECCION</button>
    </form>

    <footer class="auth-box__footer">
      <a class="auth-box__link" href="#">[RECUPERAR_CREDENCIALES]</a>
    </footer>
  </main>
  <script src="login.js"></script>
</body>
</html>
